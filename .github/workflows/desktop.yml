# 데스크톱 앱 빌드: 태그 desktop-v* 를 푸시하면 Mac dmg + Windows exe 를 만들어 GitHub Release 에 붙여요
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            cmd: npm run dist
          - os: windows-latest
            cmd: npm run dist:win
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false", GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          name: Dsm-mafia 데스크톱 ${{ github.ref_name }}
          body: "왼쪽 공부 앱 · 오른쪽 진짜 브라우저 탭.\n- Mac: dmg 를 열어 Applications 로. 서명이 없어 첫 실행은 앱을 오른쪽 클릭 → 열기.\n- Windows: Setup exe 실행 (SmartScreen 이 뜨면 추가 정보 → 실행). 무설치는 portable exe."
