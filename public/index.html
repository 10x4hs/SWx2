<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dsm-mafia</title>
  <meta name="theme-color" content="#030304">
  <link rel="preload" href="/assets/fonts/GeistVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/InstrumentSerif-Italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // 기본은 다크 (레퍼런스 영상 4개 중 3개가 어두운 무대). 밝게를 고르면 그걸 기억해요.
    let t = null; try { t = localStorage.getItem("trio-theme"); } catch {}
    document.documentElement.dataset.theme = t || "dark";
  </script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div id="app"><div class="boot">Dsm-mafia</div></div>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
