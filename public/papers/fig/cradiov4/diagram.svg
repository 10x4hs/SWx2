<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470">
  <defs><marker id="ah-cradiov4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>

  <!-- 선생님 셋 -->
  <rect class="dg-box c-violet" rx="12" x="40" y="20" width="220" height="64"/>
  <text class="dg-t b" x="150" y="46" text-anchor="middle">SigLIP2-g</text>
  <text class="dg-s" x="150" y="70" text-anchor="middle">글과 그림을 잇는 눈</text>

  <rect class="dg-box c-teal" rx="12" x="290" y="20" width="220" height="64"/>
  <text class="dg-t b" x="400" y="46" text-anchor="middle">DINOv3-7B</text>
  <text class="dg-s" x="400" y="70" text-anchor="middle">장면을 세밀하게 보는 눈</text>

  <rect class="dg-box c-rose" rx="12" x="540" y="20" width="220" height="64"/>
  <text class="dg-t b" x="650" y="46" text-anchor="middle">SAM3</text>
  <text class="dg-s" x="650" y="70" text-anchor="middle">물체를 오려 내는 눈</text>

  <!-- 증류 화살표 -->
  <path class="dg-a" fill="none" d="M150,84 L300,194" marker-end="url(#ah-cradiov4)"/>
  <path class="dg-a" fill="none" d="M400,84 L400,194" marker-end="url(#ah-cradiov4)"/>
  <path class="dg-a" fill="none" d="M650,84 L500,194" marker-end="url(#ah-cradiov4)"/>
  <text class="dg-s" x="170" y="150" text-anchor="end">특징 따라 하기 = 증류</text>
  <text class="dg-s" x="630" y="150">요약 + 공간 특징 둘 다</text>

  <!-- 학생 -->
  <rect class="dg-box c-blue" rx="12" x="200" y="196" width="400" height="70"/>
  <text class="dg-t b" x="400" y="225" text-anchor="middle">C-RADIOv4 학생 1개</text>
  <text class="dg-s" x="400" y="250" text-anchor="middle">SO400M 4억 1200만 · H 6억 3100만 파라미터</text>

  <!-- 학습 요령 -->
  <rect class="dg-zone" rx="16" x="24" y="280" width="752" height="108"/>
  <text class="dg-s" x="40" y="300">이번 버전의 학습 요령</text>

  <rect class="dg-box" rx="12" x="40" y="308" width="220" height="64"/>
  <text class="dg-t b" x="150" y="334" text-anchor="middle">해상도 섞어 학습</text>
  <text class="dg-s" x="150" y="358" text-anchor="middle">128~1152px 무작위</text>

  <rect class="dg-box c-amber" rx="12" x="290" y="308" width="220" height="64"/>
  <text class="dg-t b" x="400" y="334" text-anchor="middle">위치 밀어 비교</text>
  <text class="dg-s" x="400" y="358" text-anchor="middle">선생님 잡음은 안 베껴요</text>

  <rect class="dg-box" rx="12" x="540" y="308" width="220" height="64"/>
  <text class="dg-t b" x="650" y="334" text-anchor="middle">선생님별 손실 균형</text>
  <text class="dg-s" x="650" y="358" text-anchor="middle">DINOv3 쏠림 막기</text>

  <!-- 우리 파이프라인 -->
  <path class="dg-a dash" fill="none" d="M400,388 L400,406" marker-end="url(#ah-cradiov4)"/>
  <rect class="dg-box c-green" rx="12" x="110" y="408" width="580" height="48"/>
  <text class="dg-t b" x="400" y="438" text-anchor="middle">우리: 더 작은 학생으로 한 번 더 증류 → INT8 → RKNN</text>
</svg>
