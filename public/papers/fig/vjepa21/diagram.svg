  <defs><marker id="ah-vjepa21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  <text class="dg-t b" x="400" y="30" text-anchor="middle">V-JEPA 2.1: 픽셀 대신 특징을 맞히고, 보이는 곳도 채점해요</text>

