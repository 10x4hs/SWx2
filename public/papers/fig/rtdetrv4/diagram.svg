<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
  <defs><marker id="ah-rtdetrv4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>

