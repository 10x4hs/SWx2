  <text class="dg-s" x="76" y="298" text-anchor="middle">t=1</text>
  <text class="dg-s" x="164" y="298" text-anchor="middle">t=2</text>
  <text class="dg-s" x="252" y="298" text-anchor="middle">t=3</text>
