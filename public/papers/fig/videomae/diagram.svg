    <rect class="dg-box c-blue" x="240" y="205" width="24" height="24"/>
    <rect class="dg-box c-rose" x="264" y="205" width="24" height="24"/>
    <rect class="dg-box c-rose" x="216" y="229" width="24" height="24"/>
    <rect class="dg-box c-rose" x="240" y="229" width="24" height="24"/>
