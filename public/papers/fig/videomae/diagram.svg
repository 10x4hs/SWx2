  <text class="dg-t" x="36" y="336">모든 프레임에서 같은 자리를 함께 가려요</text>
  <text class="dg-s" x="36" y="362">옆 프레임에서 베낄 수 없으니,</text>
  <text class="dg-s" x="36" y="384">움직임과 뜻을 추론해야 복원할 수 있어요</text>
